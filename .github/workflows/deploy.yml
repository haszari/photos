name: Deploy to GitHub Pages

on:
  # Every push to main builds and deploys.
  push:
    branches: [main]
  # Also allows a manual run from the Actions tab.
  workflow_dispatch:

# Allow the job to clone the repo and create a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site output
        uses: withastro/action@v6
        with:
          # Current Active LTS. Matches .nvmrc; package.json allows 24 and up.
          node-version: 26

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
